<!doctype html>
<!--
  PROTOTYPE — THROWAWAY. Delete this whole /prototype/ directory once a variant wins.

  Question: what should jonmast.com look like?
  Three structurally-different variants, switchable via ?variant=A|B|C.

  Variants are loaded in an iframe on purpose: each one sets global styles on
  :root/body, so rendering them inline would make them fight. The iframe also
  means each variant file stays deployable as-is once it wins.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>jonmast.com — variant prototype</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0a0a0a;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #fff;
  }

  /* ---- floating switcher: deliberately not part of any design being judged ---- */
  #bar {
    position: fixed;
    z-index: 2147483647;
    left: 50%;
    bottom: max(1.1rem, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    align-items: stretch;
    gap: 2px;
    padding: 4px;
    background: #101014;
    border: 1px solid #33333d;
    border-radius: 999px;
    box-shadow: 0 10px 34px -8px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.04) inset;
    font-size: 13px;
    color: #f2f2f5;
    user-select: none;
    max-width: calc(100vw - 1.5rem);
  }
  #bar button {
    appearance: none;
    background: transparent;
    border: 0;
    color: #b9b9c4;
    font: inherit;
    line-height: 1;
    padding: 0 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  #bar button:hover { background: #23232c; color: #fff; }
  #bar button:active { background: #2e2e3a; }
  #bar button:focus-visible { outline: 2px solid #6f9dff; outline-offset: -2px; }

  #label {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 12px;
    white-space: nowrap;
    overflow: hidden;
  }
  #key {
    font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: .09em;
    background: #6f9dff;
    color: #08080c;
    padding: 4px 7px;
    border-radius: 5px;
    flex: none;
  }
  #name {
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #count {
    color: #6e6e7c;
    font-variant-numeric: tabular-nums;
    flex: none;
  }

  #dots {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 12px 0 4px;
    border-left: 1px solid #2a2a33;
    margin-left: 2px;
  }
  #dots i {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #3c3c47;
    cursor: pointer;
    transition: background .12s, transform .12s;
  }
  #dots i:hover { transform: scale(1.35); }
  #dots i.on { background: #6f9dff; }

  #hint {
    position: fixed;
    z-index: 2147483646;
    left: 50%;
    bottom: 4.3rem;
    transform: translateX(-50%);
    font-size: 11.5px;
    color: #8a8a99;
    background: rgba(16,16,20,.92);
    border: 1px solid #2a2a33;
    padding: 5px 11px;
    border-radius: 999px;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity .5s;
  }
  #hint.gone { opacity: 0; }

  @media print { #bar, #hint { display: none !important; } }
</style>
</head>
<body>

<iframe id="stage" title="variant preview"></iframe>

<div id="hint">← / → to switch · 1–5 to jump</div>

<nav id="bar" aria-label="Prototype variant switcher">
  <button id="prev" type="button" title="Previous variant (←)" aria-label="Previous variant">‹</button>
  <div id="label">
    <span id="key">A</span>
    <span id="name">Minimal</span>
    <span id="count">1/3</span>
  </div>
  <button id="next" type="button" title="Next variant (→)" aria-label="Next variant">›</button>
  <div id="dots"></div>
</nav>

<script>
(function () {
  "use strict";

  var VARIANTS = [
    { key: "A", name: "Minimal — editorial",  file: "../variants/v1-minimal.html"   },
    { key: "B", name: "Terminal — mono",      file: "../variants/v2-terminal.html"  },
    { key: "C", name: "Datasheet — spec grid", file: "../variants/v3-datasheet.html" },
    { key: "D", name: "Console — mono, light", file: "../variants/v4-console.html"  },
    { key: "E", name: "Split — dark rail",     file: "../variants/v5-split.html"    }
  ];

  var stage = document.getElementById("stage");
  var keyEl = document.getElementById("key");
  var nameEl = document.getElementById("name");
  var countEl = document.getElementById("count");
  var dotsEl = document.getElementById("dots");
  var hint = document.getElementById("hint");

  VARIANTS.forEach(function (v, i) {
    var d = document.createElement("i");
    d.title = v.key + " — " + v.name;
    d.addEventListener("click", function () { go(i, true); });
    dotsEl.appendChild(d);
  });
  var dots = dotsEl.querySelectorAll("i");

  function indexFromURL() {
    var q = new URLSearchParams(location.search).get("variant");
    if (!q) return 0;
    q = q.trim().toUpperCase();
    for (var i = 0; i < VARIANTS.length; i++) {
      if (VARIANTS[i].key === q) return i;
    }
    var n = parseInt(q, 10);
    if (n >= 1 && n <= VARIANTS.length) return n - 1;
    return 0;
  }

  var current = -1;

  function go(i, push) {
    i = (i + VARIANTS.length) % VARIANTS.length;
    if (i === current) return;
    current = i;
    var v = VARIANTS[i];

    if (stage.getAttribute("src") !== v.file) stage.setAttribute("src", v.file);

    keyEl.textContent = v.key;
    nameEl.textContent = v.name;
    countEl.textContent = (i + 1) + "/" + VARIANTS.length;
    document.title = v.key + " — " + v.name + " · jonmast.com prototype";
    for (var d = 0; d < dots.length; d++) dots[d].classList.toggle("on", d === i);

    if (push) {
      var url = location.pathname + "?variant=" + v.key;
      history.replaceState(null, "", url);
    }
  }

  document.getElementById("prev").addEventListener("click", function () { go(current - 1, true); });
  document.getElementById("next").addEventListener("click", function () { go(current + 1, true); });

  function isTyping(el) {
    if (!el) return false;
    var t = (el.tagName || "").toLowerCase();
    return t === "input" || t === "textarea" || t === "select" || el.isContentEditable;
  }

  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var doc = e.target && e.target.ownerDocument;
    if (isTyping(e.target) || (doc && isTyping(doc.activeElement))) return;

    if (e.key === "ArrowLeft")  { go(current - 1, true); e.preventDefault(); }
    else if (e.key === "ArrowRight") { go(current + 1, true); e.preventDefault(); }
    else if (e.key >= "1" && e.key <= String(VARIANTS.length)) {
      go(parseInt(e.key, 10) - 1, true); e.preventDefault();
    }
  }

  document.addEventListener("keydown", onKey);

  // The iframe is same-origin, so forward its key events too — otherwise arrows
  // stop working the moment you click inside a variant.
  stage.addEventListener("load", function () {
    try {
      stage.contentDocument.addEventListener("keydown", onKey);
    } catch (err) {
      /* cross-origin (e.g. opened via file://) — parent-level keys still work */
    }
  });

  window.addEventListener("popstate", function () { go(indexFromURL(), false); });

  go(indexFromURL(), true);

  setTimeout(function () { hint.classList.add("gone"); }, 5000);
}());
</script>
</body>
</html>
